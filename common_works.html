<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annict 視聴済み作品 共通項チェッカー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <nav class="tool-nav">
            <a href="index.html">トップ</a>
            <a href="watched_list.html">視聴済みリスト</a>
            <a href="common_works.html" class="active">共通項チェッカー</a>
        </nav>

        <h1>2人の視聴済み作品 共通項チェッカー</h1>
        <p class="lede">2人のユーザー名を指定して、お互いが視聴済み(watched)にした作品を一覧表示します。</p>

        <div class="card">
            <form id="data-form">
                <div class="field">
                    <label for="username1">Username 1 <span class="hint">(@から始まるアルファベットです ※@は除く)</span></label>
                    <input type="text" id="username1" name="username1" required>
                </div>

                <div class="field">
                    <label for="username2">Username 2</label>
                    <input type="text" id="username2" name="username2" required>
                </div>

                <div class="actions">
                    <button type="button" id="fetch-data" class="primary">Compare</button>
                    <button type="button" id="download-csv" class="secondary">Download CSV</button>
                    <button type="button" id="clear-data" class="secondary">Clear Data</button>
                </div>
            </form>
        </div>

        <div id="loading-popup">実行中です...</div>

        <div class="card">
            <div class="results-header">
                <h2>Results</h2>
                <span class="count">Common: <strong id="total-count">0</strong></span>
            </div>
            <p class="progress" id="progress-text"></p>
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Work Title</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const progressText = document.getElementById("progress-text");

        // 指定ユーザーの視聴済み(watched)作品を Map<workId, title> で全件取得する
        async function fetchWatchedWorks(username) {
            const watched = new Map();
            let page = 1;

            while (true) {
                progressText.textContent = `${username} のデータを取得中... (${page}ページ目、これまでに ${watched.size} 件のwatchedを確認)`;
                const url = `/.netlify/functions/fetch-activities?username=${username}&page=${page}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`${username} のデータ取得に失敗しました (status ${response.status})。ユーザー名が正しいか確認してください`);
                }

                const data = await response.json();

                if (!data.activities || data.activities.length === 0) {
                    break;
                }

                for (const activity of data.activities) {
                    if (activity.action === "create_status" && activity.status.kind === "watched") {
                        watched.set(activity.work.id, activity.work.title);
                    }
                }

                page++;
                await new Promise(resolve => setTimeout(resolve, 300)); // 待機(レートリミット対策)
            }

            return watched;
        }

        document.getElementById("fetch-data").addEventListener("click", async function() {
            const username1 = document.getElementById("username1").value;
            const username2 = document.getElementById("username2").value;

            const resultsTable = document.getElementById("results-table").querySelector("tbody");
            const totalCountEl = document.getElementById("total-count");
            const loadingPopup = document.getElementById("loading-popup");

            resultsTable.innerHTML = ""; // テーブルのリセット
            totalCountEl.textContent = "0"; // カウントのリセット
            progressText.textContent = "";

            loadingPopup.style.display = "block"; // 実行中モーダルを表示

            try {
                const [watched1, watched2] = await Promise.all([
                    fetchWatchedWorks(username1),
                    fetchWatchedWorks(username2),
                ]);

                progressText.textContent = `${username1}: ${watched1.size}件 / ${username2}: ${watched2.size}件のwatchedを取得しました`;

                const commonTitles = [];
                for (const [workId, title] of watched1) {
                    if (watched2.has(workId)) {
                        commonTitles.push(title);
                    }
                }
                commonTitles.sort((a, b) => a.localeCompare(b, "ja"));

                for (const title of commonTitles) {
                    const row = document.createElement("tr");
                    const titleCell = document.createElement("td");
                    titleCell.textContent = title;
                    row.appendChild(titleCell);
                    resultsTable.appendChild(row);
                }

                totalCountEl.textContent = commonTitles.length;
            } catch (error) {
                console.error("Error fetching data:", error);
                alert(error.message || "データ取得中にエラーが発生しました");
                progressText.textContent = "";
            } finally {
                loadingPopup.style.display = "none"; // 実行中モーダルを非表示
            }
        });

        document.getElementById("download-csv").addEventListener("click", function() {
            const rows = [["Work Title"]];
            const resultsTable = document.getElementById("results-table").querySelector("tbody").children;

            for (const row of resultsTable) {
                const cells = row.children;
                rows.push([cells[0].textContent]);
            }

            const csvContent = rows.map(e => e.join(",")).join("\n");
            const bom = "﻿"; // BOMを追加
            const blob = new Blob([bom + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");

            link.href = URL.createObjectURL(blob);
            link.download = "common_works.csv";
            link.style.display = "none";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById("clear-data").addEventListener("click", function() {
            const resultsTable = document.getElementById("results-table").querySelector("tbody");
            const totalCountEl = document.getElementById("total-count");

            resultsTable.innerHTML = ""; // テーブルをリセット
            totalCountEl.textContent = "0"; // カウントをリセット
            progressText.textContent = "";

            alert("データがクリアされました！");
        });
    </script>
</body>
</html>
